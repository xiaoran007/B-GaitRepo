<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BAPD8-Demo Annotator</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="app">
      <section class="viewer">
        <video id="video" src="/video" preload="metadata" controls></video>
        <div class="statusbar">
          <span id="sampleName">Loading...</span>
          <span id="timeReadout">frame 0 / 0 · 0.00s</span>
          <span id="dirtyBadge" class="dirty">saved</span>
        </div>
      </section>

      <aside class="panel">
        <div class="panelBlock">
          <div class="label">Video</div>
          <select id="videoSelect" class="videoSelect"></select>
        </div>
        <div class="panelBlock">
          <div class="label">State</div>
          <div id="stateButtons" class="states"></div>
        </div>
        <div class="panelBlock">
          <div class="label">Selection</div>
          <div class="selectionGrid">
            <span>In</span><strong id="inPoint">unset</strong>
            <span>Out</span><strong id="outPoint">unset</strong>
          </div>
          <button id="applyButton" class="primary">Apply to Selection</button>
        </div>
        <div class="panelBlock">
          <div class="label">Segment</div>
          <div id="segmentInfo" class="segmentInfo">No segment selected</div>
          <button id="applySegmentButton" class="primary segmentAction">Apply State to Segment</button>
          <div class="buttonRow">
            <button id="splitButton">Split</button>
            <button id="deleteButton">Delete</button>
          </div>
        </div>
        <div class="panelBlock">
          <button id="saveButton" class="save">Save</button>
          <button id="previewButton">Render Preview</button>
          <div id="pathInfo" class="pathInfo"></div>
          <div id="previewInfo" class="pathInfo"></div>
        </div>
      </aside>

      <section class="timelineWrap">
        <div id="timeline" class="timeline"></div>
        <div class="shortcutBar">
          Space play · A/D 1s · Q/E 5s · ,/. frame · 1-6 state · I/O range · Enter selection · M segment · B split · Backspace delete · S save
        </div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
